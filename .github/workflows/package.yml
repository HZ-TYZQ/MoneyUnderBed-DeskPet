name: Package candidates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.2
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  LINUXDEPLOY_QT_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
  LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
  QTBASE_SOURCE_URL: https://download.qt.io/official_releases/qt/6.11/6.11.2/submodules/qtbase-everywhere-src-6.11.2.tar.xz
  QTBASE_SOURCE_SHA256: 5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22
  ICU_SOURCE_URL: https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz
  ICU_SOURCE_SHA256: 818a80712ed3caacd9b652305e01afc7fa167e6f2e94996da44b90c2ab604ce1
  ICU_LICENSE_URL: https://raw.githubusercontent.com/unicode-org/icu/release-73-2/icu4c/LICENSE
  ICU_LICENSE_SHA256: f3005e195ff74d8812cc1f182a1c446fab678d70a10e3dada497585befee5416
  APPIMAGE_RUNTIME_COMMIT: 75849dce7cc37e4319b633df1f116ca895c71a12
  LINUXDEPLOY_COMMIT: cc7b86472c3caa3fd729b9dc502fd2aa78394257
  LINUXDEPLOY_QT_COMMIT: ce5291e25979d7d6417551d787f308b88c1b8d76
  FUSE_SOURCE_URL: https://github.com/libfuse/libfuse/releases/download/fuse-3.15.0/fuse-3.15.0.tar.xz
  FUSE_SOURCE_SHA256: 70589cfd5e1cff7ccd6ac91c86c01be340b227285c5e200baa284e401eea2ca0
  SQUASHFUSE_SOURCE_URL: https://github.com/vasi/squashfuse/archive/0.5.2.tar.gz
  SQUASHFUSE_SOURCE_SHA256: db0238c5981dabbd80ee09ae15387f390091668ca060a7bc38047912491443d3
  LIBFUSE_LICENSE_URL: https://raw.githubusercontent.com/libfuse/libfuse/fuse-3.15.0/LGPL2.txt
  LIBFUSE_LICENSE_SHA256: dc626520dcd53a22f727af3ee42c770e56c97a64fe3adb063799d8ab032fe551
  SQUASHFUSE_LICENSE_URL: https://raw.githubusercontent.com/vasi/squashfuse/0.5.2/LICENSE
  SQUASHFUSE_LICENSE_SHA256: 9e909cc8a8ba27b1a649c964cf9eda37de911f3138c2b64e6d2f01703904ac13
  MUSL_LICENSE_URL: https://git.musl-libc.org/cgit/musl/plain/COPYRIGHT?h=v1.2.5
  MUSL_LICENSE_SHA256: f9bc4423732350eb0b3f7ed7e91d530298476f8fec0c6c427a1c04ade22655af
  ZSTD_LICENSE_URL: https://raw.githubusercontent.com/facebook/zstd/v1.5.6/LICENSE
  ZSTD_LICENSE_SHA256: 7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8
  ZLIB_LICENSE_URL: https://raw.githubusercontent.com/madler/zlib/v1.3.1/LICENSE
  ZLIB_LICENSE_SHA256: 845efc77857d485d91fb3e0b884aaa929368c717ae8186b66fe1ed2495753243

jobs:
  metadata:
    name: Resolve package metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      label: ${{ steps.version.outputs.label }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - name: Resolve version from ref
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must be vMAJOR.MINOR.PATCH"
              exit 1
            fi
            suffix=""
            label="$version"
          else
            short="${GITHUB_SHA:0:12}"
            version="0.0.0"
            suffix="dev.$short"
            label="dev-$short"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          display_version="$version${suffix:+-$suffix}"
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"
          echo "Package version: $display_version"

  qt_source:
    name: Framework and runtime corresponding source
    needs: metadata
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
    steps:
      - name: Download and verify Qt corresponding sources
        id: names
        shell: bash
        run: |
          set -euo pipefail
          file="qtbase-everywhere-src-${QT_VERSION}.tar.xz"
          curl -fL --retry 3 -o "$file" "$QTBASE_SOURCE_URL"
          printf '%s  %s\n' "$QTBASE_SOURCE_SHA256" "$file" > "$file.sha256"
          sha256sum -c "$file.sha256"
          test -s "$file"

          icu="icu4c-73_2-src.tgz"
          curl -fL --retry 3 -o "$icu" "$ICU_SOURCE_URL"
          printf '%s  %s\n' "$ICU_SOURCE_SHA256" "$icu" > "$icu.sha256"
          sha256sum -c "$icu.sha256"

          git clone --filter=blob:none https://github.com/AppImage/type2-runtime.git type2-runtime
          git -C type2-runtime checkout "$APPIMAGE_RUNTIME_COMMIT"
          test "$(git -C type2-runtime rev-parse HEAD)" = "$APPIMAGE_RUNTIME_COMMIT"
          git -C type2-runtime archive --format=tar.gz \
            --prefix="type2-runtime-${APPIMAGE_RUNTIME_COMMIT}/" \
            -o "../type2-runtime-${APPIMAGE_RUNTIME_COMMIT}.tar.gz" HEAD
          sha256sum "type2-runtime-${APPIMAGE_RUNTIME_COMMIT}.tar.gz" \
            > "type2-runtime-${APPIMAGE_RUNTIME_COMMIT}.tar.gz.sha256"

          for spec in \
            "linuxdeploy $LINUXDEPLOY_COMMIT" \
            "linuxdeploy-plugin-qt $LINUXDEPLOY_QT_COMMIT"; do
            read -r repository commit <<< "$spec"
            git clone --filter=blob:none \
              "https://github.com/linuxdeploy/$repository.git" "$repository"
            git -C "$repository" checkout "$commit"
            test "$(git -C "$repository" rev-parse HEAD)" = "$commit"
            archive="$repository-$commit.tar.gz"
            git -C "$repository" archive --format=tar.gz \
              --prefix="$repository-$commit/" -o "../$archive" HEAD
            sha256sum "$archive" > "$archive.sha256"
          done

          fuse="fuse-3.15.0.tar.xz"
          curl -fL --retry 3 -o "$fuse" "$FUSE_SOURCE_URL"
          printf '%s  %s\n' "$FUSE_SOURCE_SHA256" "$fuse" > "$fuse.sha256"
          sha256sum -c "$fuse.sha256"

          squash="squashfuse-0.5.2.tar.gz"
          curl -fL --retry 3 -o "$squash" "$SQUASHFUSE_SOURCE_URL"
          printf '%s  %s\n' "$SQUASHFUSE_SOURCE_SHA256" "$squash" > "$squash.sha256"
          sha256sum -c "$squash.sha256"

          echo "artifact_name=Corresponding-source-${{ needs.metadata.outputs.label }}" >> "$GITHUB_OUTPUT"

      - name: Upload corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            qtbase-everywhere-src-${{ env.QT_VERSION }}.tar.xz
            qtbase-everywhere-src-${{ env.QT_VERSION }}.tar.xz.sha256
            icu4c-73_2-src.tgz
            icu4c-73_2-src.tgz.sha256
            type2-runtime-${{ env.APPIMAGE_RUNTIME_COMMIT }}.tar.gz
            type2-runtime-${{ env.APPIMAGE_RUNTIME_COMMIT }}.tar.gz.sha256
            fuse-3.15.0.tar.xz
            fuse-3.15.0.tar.xz.sha256
            squashfuse-0.5.2.tar.gz
            squashfuse-0.5.2.tar.gz.sha256
            linuxdeploy-${{ env.LINUXDEPLOY_COMMIT }}.tar.gz
            linuxdeploy-${{ env.LINUXDEPLOY_COMMIT }}.tar.gz.sha256
            linuxdeploy-plugin-qt-${{ env.LINUXDEPLOY_QT_COMMIT }}.tar.gz
            linuxdeploy-plugin-qt-${{ env.LINUXDEPLOY_QT_COMMIT }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux AppImage (Ubuntu 22.04)
    needs: metadata
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      source_artifact_name: ${{ steps.source_names.outputs.artifact_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build and XCB dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl dpkg-dev file ninja-build patchelf \
            libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 \
            libxcb1-dev libxcb-cursor0 libxcb-glx0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Assert Qt version
        shell: bash
        run: |
          set -euo pipefail
          qt_tool="$(command -v qmake || command -v qmake6)"
          actual="$($qt_tool -query QT_VERSION | tr -d '[:space:]')"
          echo "Qt reported: $actual (via $qt_tool)"
          test "$actual" = "$QT_VERSION"

      - name: Configure and build Release
        shell: bash
        run: |
          cmake --preset release \
            -DBUILD_TESTING=ON \
            -DMUB_VERSION="${{ needs.metadata.outputs.version }}" \
            -DPROJECT_VERSION_SUFFIX="${{ needs.metadata.outputs.suffix }}"
          cmake --build --preset release

      - name: Test Release build
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Install unified AppDir layout
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/release --prefix "$PWD/AppDir"
          printf '%s\n' \
            "commit=${GITHUB_SHA}" \
            "version=${{ needs.metadata.outputs.display_version }}" \
            "qt=${QT_VERSION}" \
            "platform=linux-x86_64" \
            "runner=ubuntu-22.04" > AppDir/BUILD_INFO.txt
          cmake \
            -DPACKAGE_ROOT="$PWD/AppDir" \
            -DPACKAGE_EXECUTABLE=usr/bin/money-under-bed-deskpet \
            -DPACKAGE_REQUIRED_FILES=licenses/appimage-runtime.txt \
            -P packaging/VerifyPackage.cmake

      - name: Download pinned AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 -o tools/linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_URL"
          curl -fL --retry 3 -o tools/linuxdeploy-plugin-qt-x86_64.AppImage "$LINUXDEPLOY_QT_URL"
          curl -fL --retry 3 -o tools/runtime-x86_64 "$APPIMAGE_RUNTIME_URL"
          echo "$LINUXDEPLOY_SHA256  tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_QT_SHA256  tools/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          echo "$APPIMAGE_RUNTIME_SHA256  tools/runtime-x86_64" | sha256sum -c -
          chmod +x tools/*.AppImage

      - name: Populate and prune AppDir
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          NO_STRIP: "1"
        run: |
          set -euo pipefail
          qmake_path="$(command -v qmake || command -v qmake6)"
          QMAKE="$qmake_path" \
            tools/linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --executable AppDir/usr/bin/money-under-bed-deskpet \
              --desktop-file AppDir/usr/share/applications/io.github.hz_tyzq.MoneyUnderBedDeskPet.desktop \
              --icon-file AppDir/usr/share/icons/hicolor/160x160/apps/io.github.hz_tyzq.MoneyUnderBedDeskPet.png \
              --plugin qt

          # The product loads only PNG assets (PNG support is built into QtGui),
          # uses no TLS, and provides its own Chinese UI text.  Removing these
          # soft plugins and translations reduces both package size and the
          # third-party audit surface.  The packaged self-test below proves the
          # remaining offscreen asset path before an artifact is accepted.
          rm -rf AppDir/usr/plugins/imageformats AppDir/usr/plugins/tls \
            AppDir/usr/translations
          rm -f AppDir/usr/lib/libQt6Svg.so.6

          curl -fL --retry 3 -o AppDir/licenses/icu.txt "$ICU_LICENSE_URL"
          echo "$ICU_LICENSE_SHA256  AppDir/licenses/icu.txt" | sha256sum -c -

          mkdir -p AppDir/licenses/appimage-runtime
          while IFS=$'\t' read -r name url checksum; do
            target="AppDir/licenses/appimage-runtime/$name"
            curl -fL --retry 3 -o "$target" "$url"
            echo "$checksum  $target" | sha256sum -c -
          done <<EOF
          libfuse-LGPL-2.1.txt	$LIBFUSE_LICENSE_URL	$LIBFUSE_LICENSE_SHA256
          squashfuse.txt	$SQUASHFUSE_LICENSE_URL	$SQUASHFUSE_LICENSE_SHA256
          musl.txt	$MUSL_LICENSE_URL	$MUSL_LICENSE_SHA256
          zstd.txt	$ZSTD_LICENSE_URL	$ZSTD_LICENSE_SHA256
          zlib.txt	$ZLIB_LICENSE_URL	$ZLIB_LICENSE_SHA256
          EOF

          packaging/CollectLinuxRuntime.sh AppDir linux-source-packages.tsv

      - name: Archive exact Ubuntu source packages
        id: source_names
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -n 's/^deb /deb-src /p' /etc/apt/sources.list \
            | sudo tee /etc/apt/sources.list.d/mub-source.list >/dev/null
          sudo apt-get update
          mkdir -p linux-system-source
          while IFS=$'\t' read -r package version; do
            (cd linux-system-source && apt-get source --download-only "$package=$version")
          done < linux-source-packages.tsv
          cp linux-source-packages.tsv linux-system-source/SOURCE_PACKAGES.tsv
          (
            cd linux-system-source
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          test -s linux-system-source/SHA256SUMS
          echo "artifact_name=Linux-system-source-${{ needs.metadata.outputs.label }}" \
            >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        id: names
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy 自带的旧 strip 不认识现代 Qt ELF 的 .relr.dyn。
          # 官方支持 NO_STRIP；Release 体积以可靠可运行为先，后续再单独评估剥离。
          NO_STRIP: "1"
        run: |
          set -euo pipefail
          base="MoneyUnderBed-DeskPet-linux-x86_64-${{ needs.metadata.outputs.label }}"
          output="$base.AppImage"
          LDAI_OUTPUT="$output" \
          LDAI_RUNTIME_FILE="$PWD/tools/runtime-x86_64" \
            tools/linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --output appimage
          test -s "$output"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$base" >> "$GITHUB_OUTPUT"

      - name: Verify the actual AppImage
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          image="${{ steps.names.outputs.base }}.AppImage"
          "./$image" --self-test

          extract_dir="$(mktemp -d)"
          cleanup() { rm -rf "$extract_dir"; }
          trap cleanup EXIT
          (
            cd "$extract_dir"
            env -u APPIMAGE_EXTRACT_AND_RUN \
              "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null
          )
          cmake \
            -DPACKAGE_ROOT="$extract_dir/squashfs-root" \
            -DPACKAGE_EXECUTABLE=usr/bin/money-under-bed-deskpet \
            "-DPACKAGE_REQUIRED_FILES=usr/plugins/platforms/libqxcb.so;usr/plugins/platforms/libqoffscreen.so;licenses/appimage-runtime.txt;licenses/appimage-tooling.txt;licenses/icu.txt;licenses/linux-runtime.tsv;licenses/appimage-runtime/libfuse-LGPL-2.1.txt;licenses/appimage-runtime/squashfuse.txt;licenses/appimage-runtime/musl.txt;licenses/appimage-runtime/zstd.txt;licenses/appimage-runtime/zlib.txt" \
            "-DPACKAGE_FORBIDDEN_PATHS=usr/plugins/imageformats;usr/plugins/tls;usr/translations;usr/lib/libQt6Svg.so.6" \
            -P packaging/VerifyPackage.cmake

          base="${image%.AppImage}"
          (
            cd "$extract_dir/squashfs-root"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            find . -type l -printf 'SYMLINK  %p -> %l\n' | sort
          ) > "$GITHUB_WORKSPACE/$base.contents.txt"

          : > "$GITHUB_WORKSPACE/$base.elf-needed.txt"
          while IFS= read -r -d '' candidate; do
            if readelf -h "$candidate" >/dev/null 2>&1; then
              relative="${candidate#"$extract_dir/squashfs-root/"}"
              printf '[%s]\n' "$relative" >> "$GITHUB_WORKSPACE/$base.elf-needed.txt"
              readelf -d "$candidate" 2>/dev/null \
                | sed -n 's/.*Shared library: \[\(.*\)\]/  \1/p' \
                >> "$GITHUB_WORKSPACE/$base.elf-needed.txt"
            fi
          done < <(find "$extract_dir/squashfs-root" -type f -print0 | sort -z)
          test -s "$GITHUB_WORKSPACE/$base.contents.txt"
          test -s "$GITHUB_WORKSPACE/$base.elf-needed.txt"

      - name: Create AppImage checksum
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.names.outputs.base }}.AppImage"
          sha256sum "$image" > "$image.sha256"
          hash="$(cut -d ' ' -f 1 "$image.sha256")"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $hash"

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## Linux candidate"
            echo "- AppImage: \`${{ steps.names.outputs.base }}.AppImage\`"
            echo "- Qt: \`${QT_VERSION}\`"
            echo "- SHA-256: \`${{ steps.checksum.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            ${{ steps.names.outputs.base }}.AppImage
            ${{ steps.names.outputs.base }}.AppImage.sha256
            ${{ steps.names.outputs.base }}.contents.txt
            ${{ steps.names.outputs.base }}.elf-needed.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.source_names.outputs.artifact_name }}
          path: linux-system-source/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows portable ZIP (MSVC 2022)
    needs: metadata
    runs-on: windows-2022
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@c1ed231f339aec74961130db0459823a08f1b215 # v1.9.0
        with:
          arch: x64

      - name: Assert Qt version
        shell: bash
        run: |
          qt_tool="$(command -v qmake || command -v qmake6)"
          actual="$($qt_tool -query QT_VERSION | tr -d '[:space:]')"
          echo "Qt reported: $actual (via $qt_tool)"
          test "$actual" = "$QT_VERSION"

      - name: Configure and build Release
        shell: pwsh
        run: |
          cmake --preset release `
            -DBUILD_TESTING=ON `
            "-DMUB_VERSION=${{ needs.metadata.outputs.version }}" `
            "-DPROJECT_VERSION_SUFFIX=${{ needs.metadata.outputs.suffix }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release
          exit $LASTEXITCODE

      - name: Test Release build
        shell: pwsh
        run: |
          ctest --test-dir build/release --output-on-failure
          exit $LASTEXITCODE

      - name: Install and deploy portable directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build/release --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          windeployqt --release --no-translations --no-compiler-runtime `
            --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw `
            --skip-plugin-types generic,iconengines,imageformats,networkinformation,tls `
            package\money-under-bed-deskpet.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # windeployqt 只按桌面运行路径收集 qwindows；CI 的实际发行包自检
          # 还需要 offscreen，必须显式放入包内，不能从 runner 的 Qt 目录借用。
          $qtPlugins = (& qmake -query QT_INSTALL_PLUGINS).Trim()
          $offscreen = Join-Path $qtPlugins 'platforms\qoffscreen.dll'
          if (-not (Test-Path $offscreen)) {
            throw "Qt offscreen platform plugin not found: $offscreen"
          }
          New-Item -ItemType Directory -Force package\platforms | Out-Null
          Copy-Item $offscreen package\platforms\qoffscreen.dll

          # 真正免安装：直接部署 app-local CRT DLL，不附带运行库安装器。
          $crt = Get-ChildItem -Path (Join-Path $env:VCToolsRedistDir 'x64') `
            -Filter 'Microsoft.VC*.CRT' -Directory | Select-Object -First 1
          if (-not $crt) { throw "MSVC runtime folder not found under $env:VCToolsRedistDir" }
          Copy-Item (Join-Path $crt.FullName 'msvcp140*.dll') package
          Copy-Item (Join-Path $crt.FullName 'vcruntime140*.dll') package
          foreach ($required in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path package $required))) {
              throw "Missing app-local MSVC runtime: $required"
            }
          }

          @(
            "commit=${{ github.sha }}"
            "version=${{ needs.metadata.outputs.display_version }}"
            "qt=${{ env.QT_VERSION }}"
            "platform=windows-x86_64"
            "runner=windows-2022"
          ) | Set-Content package\BUILD_INFO.txt -Encoding utf8

      - name: Verify GUI subsystem and packaged self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'package\money-under-bed-deskpet.exe'
          $headers = (dumpbin /headers $exe | Out-String)
          if ($headers -notmatch 'Windows GUI') {
            throw 'Packaged executable is not using the Windows GUI subsystem.'
          }

          cmake "-DPACKAGE_ROOT=$PWD\package" `
            "-DPACKAGE_EXECUTABLE=money-under-bed-deskpet.exe" `
            "-DPACKAGE_REQUIRED_FILES=platforms/qwindows.dll;platforms/qoffscreen.dll;licenses/msvc-runtime.md" `
            "-DPACKAGE_FORBIDDEN_PATHS=d3dcompiler_47.dll;dxcompiler.dll;dxil.dll;opengl32sw.dll;generic;iconengines;imageformats;networkinformation;tls;Qt6Svg.dll" `
            -P packaging/VerifyPackage.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' `
            -WorkingDirectory (Join-Path $PWD 'package') -Wait -PassThru -NoNewWindow
          Write-Host "packaged self-test exit=$($process.ExitCode)"
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

          cmake "-DPACKAGE_ROOT=$PWD\package" `
            "-DPACKAGE_EXECUTABLE=money-under-bed-deskpet.exe" `
            -P packaging/VerifyPackage.cmake
          exit $LASTEXITCODE

      - name: Create ZIP and checksum
        id: names
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'MoneyUnderBed-DeskPet-windows-x86_64-${{ needs.metadata.outputs.label }}'
          Compress-Archive -Path package\* -DestinationPath "$base.zip"
          $hash = (Get-FileHash "$base.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\$base.zip.sha256", "$hash  $base.zip`n", [Text.Encoding]::ASCII)

          $packageRoot = (Resolve-Path package).Path
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $contents = Get-ChildItem package -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($packageRoot.Length + 1).Replace('\', '/')
            $fileHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$fileHash  $relative"
          }
          [IO.File]::WriteAllLines("$PWD\$base.contents.txt", $contents, $utf8NoBom)

          $imports = [Collections.Generic.List[string]]::new()
          Get-ChildItem package -Recurse -File | Where-Object {
            $_.Extension -in '.exe', '.dll'
          } | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($packageRoot.Length + 1).Replace('\', '/')
            $imports.Add("[$relative]")
            $dump = (dumpbin /dependents $_.FullName | Out-String)
            foreach ($line in $dump -split "`r?`n") {
              if ($line -match '^\s+([A-Za-z0-9_.+-]+\.dll)\s*$') {
                $imports.Add("  $($Matches[1])")
              }
            }
          }
          [IO.File]::WriteAllLines("$PWD\$base.dll-dependencies.txt", $imports, $utf8NoBom)
          if ((Get-Item "$base.contents.txt").Length -eq 0) { throw 'Empty package contents manifest' }
          if ((Get-Item "$base.dll-dependencies.txt").Length -eq 0) { throw 'Empty DLL dependency manifest' }

          "base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_name=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA-256: $hash"

      - name: Job summary
        shell: pwsh
        run: |
          @(
            '## Windows candidate'
            '- ZIP: ``${{ steps.names.outputs.base }}.zip``'
            '- Qt: ``${{ env.QT_VERSION }}``'
            '- SHA-256: ``${{ steps.names.outputs.sha256 }}``'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            ${{ steps.names.outputs.base }}.zip
            ${{ steps.names.outputs.base }}.zip.sha256
            ${{ steps.names.outputs.base }}.contents.txt
            ${{ steps.names.outputs.base }}.dll-dependencies.txt
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - metadata
      - qt_source
      - linux
      - windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download Linux candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.linux.outputs.artifact_name }}
          path: dist/linux

      - name: Download Windows candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: dist/windows

      - name: Download Qt corresponding source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.qt_source.outputs.artifact_name }}
          path: dist/source

      - name: Download Linux system corresponding source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.linux.outputs.source_artifact_name }}
          path: dist/linux-source

      - name: Verify downloaded checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/linux && sha256sum -c ./*.sha256)
          (cd dist/windows && sha256sum -c ./*.sha256)
          (cd dist/source && sha256sum -c ./*.sha256)
          (cd dist/linux-source && sha256sum -c SHA256SUMS)

      # 对应源码单独成一个 Release，正式 Release 只留二进制与校验文件。
      #
      # 源码 Release **直接公开**，不走草稿：草稿对外不可访问，如果二进制先转公开
      # 而源码还是草稿，那一刻就是不合规的 GPL 分发。让源码先在，这个窗口就不存在。
      #
      # 标签用 `sources-<version>`，**不能**用 `v<version>-sources` 之类：
      # 本工作流与 build.yml 的过滤都是 `v*.*.*`，那种名字会匹配并触发整条流水线，
      # 而 metadata 只接受 MAJOR.MINOR.PATCH，结果是一次注定失败的运行
      # （docs/Decisions.md 第 14.1 节记录的同一个陷阱）。
      # tst_releaseworkflows 对此有断言。
      - name: Publish corresponding-source release
        id: sources
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          tag="sources-$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mapfile -t files < <(find dist/source dist/linux-source -type f -print | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No corresponding-source files were collected"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # 源码归档按定义不该变。同一标签重跑时不覆盖，只核对完整性——
            # 数量对不上说明上一次上传残缺或内容被改过，那是必须报错的事，
            # 不能默默接受一个不完整的源码 Release。
            existing="$(gh release view "$tag" --json assets --jq '[.assets[]] | length')"
            if [[ "$existing" -ne ${#files[@]} ]]; then
              echo "::error::$tag already exists with $existing assets, expected ${#files[@]}"
              exit 1
            fi
            echo "$tag already exists with all ${#files[@]} assets; leaving it untouched"
          else
            sed -e "s/@VERSION@/$VERSION/g" \
                -e "s/@SOURCES_TAG@/$tag/g" \
                -e "s/@COMMIT@/$GITHUB_SHA/g" \
                -e "s/@RUN_ID@/$GITHUB_RUN_ID/g" \
                packaging/sources-release-notes.md > sources-notes.md
            # --latest=false：源码 Release 不该抢走 Latest 标记。
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "v$VERSION 的对应源码（无可执行文件）" \
              --notes-file sources-notes.md \
              "${files[@]}"
          fi

      - name: Create or refresh draft release
        shell: bash
        env:
          SOURCES_TAG: ${{ steps.sources.outputs.tag }}
        run: |
          set -euo pipefail
          # 只有二进制与其校验/清单文件进正式 Release，源码在上一步的 Release 里。
          mapfile -t files < <(find dist/linux dist/windows -type f -print | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != true ]]; then
              echo "::error::Refusing to replace assets of an already published release"
              exit 1
            fi
            # A draft may already contain manually recorded candidate results.
            # Refreshing assets must never replace those notes with the checked-in
            # pre-validation template.  The template is used only at creation.
            gh release edit "$GITHUB_REF_NAME" \
              --draft \
              --title "MoneyUnderBed DeskPet ${{ needs.metadata.outputs.version }}"
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
          else
            sed "s/@SOURCES_TAG@/$SOURCES_TAG/g" \
              packaging/release-notes.md > release-notes.md
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "MoneyUnderBed DeskPet ${{ needs.metadata.outputs.version }}" \
              --notes-file release-notes.md \
              "${files[@]}"
          fi
