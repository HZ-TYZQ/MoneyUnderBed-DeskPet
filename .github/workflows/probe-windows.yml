# 阶段 1 的临时工作流：只构建和打包 probes/window/。
# 它不构建正式产品，也不是最终 CI。阶段 2 建立正式双平台 CI 后本文件即可删除。
# 对应 docs/Plans/DevelopmentPlan.md 第 6.2 节。
name: Windows window probe

on:
  workflow_dispatch:
  # 不加 paths 过滤：新建分支的首次 push 不会匹配 paths，实测两次都没触发。
  # push 限定 main，是为了避免同仓库的 PR 分支同时触发 push 和 pull_request
  # 跑两遍；Windows runner 按 2 倍计费。需要每个分支都跑时去掉 branches 即可。
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # 必须与正式工程一致，否则探针结论不能代表产品。
  QT_VERSION: 6.11.2
  QT_ARCH: win64_msvc2022_64

jobs:
  probe:
    name: Build and package probe
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # 第三方 Action 锁定完整提交 SHA，避免同一个 tag 指向不同代码。
      #
      # aqtsource 指向 aqtinstall 的 Git 提交而不是 PyPI 版本，原因是：
      # Qt 官方存档在 6.11.0 改了目录结构，从 qt6_XXX/qt6_XXX/Updates.xml
      # 改成按架构分目录的 qt6_XXXX/qt6_XXXX_<arch>/Updates.xml。
      # aqtinstall 在 PyPI 上的最新发布版 3.3.0（2025-06-02）只认旧结构，
      # 装 6.11.x 会报 "Failed to locate XML data for Qt version"。
      # 该修复已经合入上游 master（issue #959 / #1000），但 3.4.0 尚未发布。
      # 这里同样锁定完整提交 SHA，不使用浮动的 master。
      # aqtinstall 发布 3.4.0 之后应改回 aqtversion 固定版本号。
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@c1ed231f339aec74961130db0459823a08f1b215 # v1.9.0
        with:
          arch: x64

      - name: Report toolchain
        shell: pwsh
        run: |
          qmake -query QT_VERSION
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1

      - name: Assert Qt version
        shell: pwsh
        run: |
          $actual = (qmake -query QT_VERSION).Trim()
          Write-Host "Qt reported: $actual"
          if ($actual -ne "${{ env.QT_VERSION }}") {
            throw "Qt version mismatch: expected ${{ env.QT_VERSION }}, got $actual"
          }

      - name: Configure
        shell: pwsh
        run: >
          cmake -S probes/window -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        shell: pwsh
        run: cmake --build build

      # 无 GUI 的参数校验与 offscreen 冒烟。
      # 这些检查只证明代码路径可执行，不能代表真实桌面行为。
      # 本步骤刻意让探针以非零码退出，因此关掉 PowerShell 7 默认把非零原生
      # 退出码当成错误的行为，并在结尾显式 exit 0。
      # 否则最后一条断言留下的 $LASTEXITCODE 会成为整个步骤的退出码，
      # 断言全过也会被判失败。
      - name: Argument validation
        shell: pwsh
        working-directory: build
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $failures = @()
          function Assert-Exit([string]$label, [int]$expected, [scriptblock]$run) {
            & $run *> $null
            $code = $LASTEXITCODE
            $ok = $code -eq $expected
            Write-Host "$label -> exit=$code (expected $expected) $(if ($ok) { 'ok' } else { 'FAIL' })"
            if (-not $ok) { $script:failures += "$label expected exit $expected, got $code" }
          }
          Assert-Exit 'unknown case'     2 { .\deskpet-probe.exe --case bogus }
          Assert-Exit 'invalid scale 0'  2 { .\deskpet-probe.exe --case render --scale 0 }
          Assert-Exit 'invalid scale 99' 2 { .\deskpet-probe.exe --case render --scale 99 }
          Assert-Exit 'invalid duration' 2 { .\deskpet-probe.exe --case render --duration -1 }
          Assert-Exit 'missing sprite'   3 { .\deskpet-probe.exe --case render --sprite nope.png }
          Assert-Exit 'bad dimensions'   3 { .\deskpet-probe.exe --case render --sprite ..\assets\face\natural.png }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "All argument validation checks passed."
          exit 0

      - name: Offscreen smoke test
        shell: pwsh
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $cases = (.\deskpet-probe.exe --list-cases) -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          Write-Host "Cases: $($cases -join ', ')"
          $failed = @()
          foreach ($c in $cases) {
            .\deskpet-probe.exe --case $c --duration 1 --log "smoke-$c.log" *> $null
            $code = $LASTEXITCODE
            Write-Host "$c -> exit=$code"
            if ($code -ne 0) {
              if (Test-Path "smoke-$c.log") { Get-Content "smoke-$c.log" -Tail 20 }
              $failed += "$c (exit $code)"
            }
          }
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "::error::Offscreen case failed: $_" }
            exit 1
          }
          Write-Host "All $($cases.Count) cases passed offscreen."
          exit 0

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build --prefix package
          # 保留 opengl-sw 与 d3dcompiler：项目所有者的测试机不一定有可用的
          # 图形驱动路径，少一个 DLL 就要多一轮往返。
          #
          # 必须显式写 --no-compiler-runtime：windeployqt 在检测到 Visual
          # Studio 环境时默认会带上运行库，而它带的是 25 MB 的
          # vc_redist.x64.exe 安装器，不是运行库本身。没装过 VC++ 运行库
          # 的机器仍然起不来，测试者还得先手动跑安装器。
          # 改为直接把运行库 DLL 放在 exe 旁边（app-local 部署），
          # 体积从 25 MB 降到约 1 MB，且真正免安装。
          windeployqt --release --no-translations --no-compiler-runtime `
            package\deskpet-probe.exe

          $crt = Get-ChildItem -Path (Join-Path $env:VCToolsRedistDir 'x64') `
            -Filter 'Microsoft.VC*.CRT' -Directory | Select-Object -First 1
          if (-not $crt) { throw "MSVC runtime redist folder not found under $env:VCToolsRedistDir" }
          Write-Host "MSVC runtime from: $($crt.FullName)"
          Copy-Item (Join-Path $crt.FullName 'msvcp140*.dll') package
          Copy-Item (Join-Path $crt.FullName 'vcruntime140*.dll') package
          foreach ($required in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path 'package' $required))) {
              throw "Missing MSVC runtime in package: $required"
            }
          }
          if (Test-Path 'package\vc_redist.x64.exe') {
            throw "vc_redist.x64.exe must not be packaged; the runtime DLLs are deployed app-local instead."
          }
          "commit=${{ github.sha }}" | Out-File package\BUILD_INFO.txt -Encoding utf8
          "qt=${{ env.QT_VERSION }}" | Out-File package\BUILD_INFO.txt -Encoding utf8 -Append
          "arch=${{ env.QT_ARCH }}" | Out-File package\BUILD_INFO.txt -Encoding utf8 -Append
          "runner=${{ runner.os }}-${{ runner.arch }}" | Out-File package\BUILD_INFO.txt -Encoding utf8 -Append
          Get-ChildItem -Recurse package | Select-Object FullName, Length

      - name: Verify packaged binary starts
        shell: pwsh
        working-directory: package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          .\deskpet-probe.exe --case build
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Packaged probe failed --case build"; exit 1 }
          .\deskpet-probe.exe --case render --duration 1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Packaged probe failed to load the bundled sprite"; exit 1 }
          Write-Host "Packaged probe starts and loads the bundled sprite."
          exit 0

      - name: Create ZIP and checksum
        id: pack
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0, 12)
          $name = "deskpet-probe-windows-x64-$short"
          Compress-Archive -Path package\* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
          Write-Host "sha256=$hash"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Job summary
        shell: pwsh
        run: |
          "## Windows probe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- commit: ``${{ github.sha }}``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Qt: ``${{ env.QT_VERSION }}`` (${{ env.QT_ARCH }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- ZIP: ``${{ steps.pack.outputs.name }}.zip``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- SHA-256: ``${{ steps.pack.outputs.sha256 }}``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload probe package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.name }}.zip
            ${{ steps.pack.outputs.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
